<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法演示与埋点报表系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .tabs { display: flex; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; transition: all 0.3s; border: none; background: none; font-size: 16px; }
        .tab.active { background: #667eea; color: #fff; font-weight: bold; }
        .tab:hover:not(.active) { background: #f0f0f0; }
        .panel { display: none; background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .panel.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.3s; margin-right: 10px; }
        .btn-primary { background: #667eea; color: #fff; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-success:hover { background: #218838; }
        .result-box { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px; border-left: 4px solid #667eea; min-height: 60px; }
        .result-box pre { white-space: pre-wrap; word-wrap: break-word; }
        .chart-container { width: 100%; height: 400px; margin-top: 20px; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 20px; }
        .chart-card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .chart-card h3 { margin-bottom: 10px; font-size: 16px; color: #555; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .controls select, .controls input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .message { padding: 10px; border-radius: 4px; margin-top: 10px; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="header">
        <h1>算法演示与埋点报表系统</h1>
        <p>HelloWorld / 哈希算法 / 冒泡排序 & 调用统计可视化</p>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('helloworld')">HelloWorld</button>
            <button class="tab" onclick="switchTab('hash')">哈希算法</button>
            <button class="tab" onclick="switchTab('bubble')">冒泡排序</button>
            <button class="tab" onclick="switchTab('report')">调用报表</button>
        </div>

        <!-- HelloWorld Panel -->
        <div id="panel-helloworld" class="panel active">
            <h2>HelloWorld 演示</h2>
            <div class="form-group">
                <label>输入名称（可选）</label>
                <input type="text" id="hw-name" placeholder="例如：Manyu">
            </div>
            <button class="btn btn-primary" onclick="runHelloWorld()">执行</button>
            <button class="btn btn-success" onclick="exportResult('HELLOWORLD')">导出结果</button>
            <div class="result-box" id="hw-result">点击"执行"查看结果</div>
        </div>

        <!-- Hash Panel -->
        <div id="panel-hash" class="panel">
            <h2>哈希算法演示</h2>
            <div class="form-group">
                <label>输入内容</label>
                <input type="text" id="hash-content" placeholder="例如：hello world" value="hello world">
            </div>
            <div class="form-group">
                <label>算法类型</label>
                <select id="hash-algo">
                    <option value="MD5">MD5</option>
                    <option value="SHA-256">SHA-256</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="runHash()">执行</button>
            <button class="btn btn-success" onclick="exportResult('HASH')">导出结果</button>
            <div class="result-box" id="hash-result">点击"执行"查看结果</div>
        </div>

        <!-- Bubble Sort Panel -->
        <div id="panel-bubble" class="panel">
            <h2>冒泡排序演示</h2>
            <div class="form-group">
                <label>输入数组（逗号分隔）</label>
                <input type="text" id="bubble-array" placeholder="例如：5,3,8,4,2" value="5,3,8,4,2">
            </div>
            <div class="form-group">
                <label>排序方向</label>
                <select id="bubble-order">
                    <option value="ASC">升序（ASC）</option>
                    <option value="DESC">降序（DESC）</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="runBubbleSort()">执行</button>
            <button class="btn btn-success" onclick="exportResult('BUBBLE_SORT')">导出结果</button>
            <div class="result-box" id="bubble-result">点击"执行"查看结果</div>
        </div>

        <!-- Report Panel -->
        <div id="panel-report" class="panel">
            <h2>调用统计报表</h2>
            <div class="controls">
                <select id="report-dimension">
                    <option value="caller_type">人员类型</option>
                    <option value="caller_level">人员层级</option>
                    <option value="caller_dept">人员部门</option>
                    <option value="algorithm_type">算法类型</option>
                </select>
                <input type="date" id="report-start" placeholder="开始日期">
                <input type="date" id="report-end" placeholder="结束日期">
                <button class="btn btn-primary" onclick="loadReport()">查询</button>
            </div>
            <div class="charts-grid">
                <div class="chart-card">
                    <h3>柱状图 - 调用次数统计</h3>
                    <div id="chart-bar" class="chart-container"></div>
                </div>
                <div class="chart-card">
                    <h3>饼图 - 调用分布</h3>
                    <div id="chart-pie" class="chart-container"></div>
                </div>
                <div class="chart-card" style="grid-column: 1 / -1;">
                    <h3>折线图 - 调用趋势</h3>
                    <div class="controls">
                        <select id="trend-granularity">
                            <option value="DAY">按日</option>
                            <option value="WEEK">按周</option>
                            <option value="MONTH">按月</option>
                        </select>
                    </div>
                    <div id="chart-line" class="chart-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab')[['helloworld','hash','bubble','report'].indexOf(tab)].classList.add('active');
            document.getElementById('panel-' + tab).classList.add('active');
            if (tab === 'report') loadReport();
        }

        async function apiPost(path, body) {
            const res = await fetch(API_BASE + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return await res.json();
        }

        async function apiGet(path) {
            const res = await fetch(API_BASE + path);
            return await res.json();
        }

        async function runHelloWorld() {
            const name = document.getElementById('hw-name').value;
            const result = await apiPost('/algorithm/helloworld', { name });
            document.getElementById('hw-result').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        }

        async function runHash() {
            const content = document.getElementById('hash-content').value;
            const algorithm = document.getElementById('hash-algo').value;
            const result = await apiPost('/algorithm/hash', { content, algorithm });
            document.getElementById('hash-result').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        }

        async function runBubbleSort() {
            const arrayStr = document.getElementById('bubble-array').value;
            const order = document.getElementById('bubble-order').value;
            const array = arrayStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
            const result = await apiPost('/algorithm/bubbleSort', { array, order });
            document.getElementById('bubble-result').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        }

        async function exportResult(algorithmType) {
            const result = await apiPost('/export/result', { algorithmType, params: {} });
            if (result.data && result.data.taskId) {
                alert('导出任务已创建，任务ID: ' + result.data.taskId);
            } else {
                alert('导出失败: ' + (result.msg || '未知错误'));
            }
        }

        let barChart, pieChart, lineChart;

        async function loadReport() {
            const dimension = document.getElementById('report-dimension').value;
            const startTime = document.getElementById('report-start').value || '2026-01-01 00:00:00';
            const endTime = document.getElementById('report-end').value || '2026-12-31 23:59:59';
            const granularity = document.getElementById('trend-granularity').value;

            // Statistics for bar & pie
            const stats = await apiGet(`/tracking/statistics?dimension=${dimension}&startTime=${startTime}&endTime=${endTime}`);
            const data = stats.data && stats.data.data ? stats.data.data : [];
            const labels = data.map(d => d.dimensionKey);
            const values = data.map(d => d.count);

            // Bar chart
            barChart = echarts.init(document.getElementById('chart-bar'));
            barChart.setOption({
                tooltip: {},
                xAxis: { type: 'category', data: labels, axisLabel: { rotate: 30 } },
                yAxis: { type: 'value' },
                series: [{ data: values, type: 'bar', itemStyle: { color: '#667eea' } }]
            });

            // Pie chart
            const pieData = labels.map((label, i) => ({ name: label, value: values[i] }));
            pieChart = echarts.init(document.getElementById('chart-pie'));
            pieChart.setOption({
                tooltip: { trigger: 'item' },
                series: [{ type: 'pie', radius: '50%', data: pieData }]
            });

            // Trend line
            const trend = await apiGet(`/tracking/trend?timeGranularity=${granularity}&startTime=${startTime}&endTime=${endTime}`);
            const trendData = trend.data && trend.data.data ? trend.data.data : [];
            lineChart = echarts.init(document.getElementById('chart-line'));
            lineChart.setOption({
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: trendData.map(d => d.timeLabel) },
                yAxis: { type: 'value' },
                series: [{ data: trendData.map(d => d.count), type: 'line', smooth: true, areaStyle: {} }]
            });
        }

        window.addEventListener('resize', () => {
            barChart && barChart.resize();
            pieChart && pieChart.resize();
            lineChart && lineChart.resize();
        });
    </script>
</body>
</html>

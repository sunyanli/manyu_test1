server:
  port: 8080

spring:
  application:
    name: xchain-demo-api
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:xchain_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.alipay.xchain.demo.dal.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.alipay.xchain.demo: INFO
